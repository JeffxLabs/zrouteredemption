<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>Z Route Promo Codes · JeffxLabs</title>
  <style>
    :root{--bg:#08111f;--panel:#132139;--line:#29415f;--text:#f5f8ff;--muted:#9bb0c9;--cyan:#62e6d2;--bad:#ff8f9a}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 10% 0,#1d3152,transparent 38rem),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:850px;margin:auto;padding:26px 18px 55px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:58px}.brand{color:var(--cyan);font-weight:800;letter-spacing:.1em;font-size:13px}.brand span{color:var(--muted);font-weight:500}.top a{color:var(--muted);text-decoration:none;font-size:13px}.top a:hover{color:var(--text)}.eyebrow{color:var(--cyan);font-size:12px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:clamp(40px,8vw,68px);line-height:1;letter-spacing:-.06em;margin:12px 0 46px}.toolbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.count{color:var(--muted);font-size:13px}.report{display:none;justify-content:space-between;align-items:center;gap:14px;margin:0 0 14px;padding:12px 14px;border:1px solid #6a3c49;border-radius:13px;background:#261b29;color:#ffd8dc}.report.show{display:flex}.report-copy{white-space:nowrap;border-color:var(--bad);color:#240b10;background:var(--bad)}.codes{display:grid;gap:12px}.card{background:linear-gradient(145deg,#15243b,#101a2b);border:1px solid var(--line);border-radius:17px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;transition:opacity .18s,border-color .18s,padding .18s}.card.is-used{opacity:.42;background:#0b1320;border-color:#18283c;padding:10px 14px}.card.is-used:hover,.card.is-used:focus-within{opacity:.7}.card.is-used .feedback,.card.is-used .copy{display:none}.card.is-used .code{font-size:16px;color:var(--muted);text-decoration:line-through}.code{font:700 22px ui-monospace,monospace;letter-spacing:.035em;overflow-wrap:anywhere}.actions,.feedback{display:flex;gap:7px;align-items:center}.feedback{margin-top:13px}.btn{border:1px solid var(--line);background:#1a2a43;color:var(--text);border-radius:10px;padding:8px 11px;min-height:36px;font:600 12px system-ui;cursor:pointer}.btn:hover,.btn:focus-visible{border-color:var(--cyan);outline:none}.selected,.used{border-color:var(--cyan);color:var(--cyan);background:#17343b}.failed.selected{border-color:var(--bad);color:var(--bad);background:#3a2029}.copy{background:linear-gradient(135deg,var(--cyan),#38b8ba);border:0;color:#07151a;font-size:13px}.stats{color:var(--muted);font-size:12px;margin-left:3px}.worked{color:var(--cyan)}.failed{color:var(--bad)}footer{text-align:center;color:#71819d;font-size:12px;margin-top:40px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#f5f8ff;color:#101827;padding:10px 16px;border-radius:99px;font-weight:700;font-size:13px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:600px){.wrap{padding-top:20px}.top{margin-bottom:44px}.hero h1{margin-bottom:36px}.card{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%}.feedback{flex-wrap:wrap}.count{font-size:12px}.report{align-items:stretch;flex-direction:column}.report-copy{white-space:normal;width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="top"><div class="brand">JEFFXLABS <span>/ Z ROUTE</span></div><a href="../">Progression planner ↗</a></nav>
    <section class="hero"><div class="eyebrow">Z Route: Redemption</div><h1>Promo codes,<br>ready to redeem.</h1></section>
    <div class="toolbar"><strong>Current codes</strong><span class="count" id="count"></span></div>
    <aside class="report" id="report"><span id="report-summary"></span><button class="btn report-copy" id="report-copy" type="button">Copy inactive report</button></aside>
    <section class="codes" id="codes"></section>
    <footer>Built by JeffxLabs</footer>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    // Manage promo codes here: add new values or remove expired ones.
    const codes=['ZRRUSG26','DC50KURM','ZRDAD26','ZRRLW2AC','ZRSURV26','ZRR2NX6Q','ZRR999','ZRRFT9BM','ZRRC7WES','ZRYOUTH26','DC45KIGS','ZRRVJ4YD'];
    const voteKey='zroute-votes',usedKey='zroute-used';
    function readJSON(key,fallback){try{const value=JSON.parse(localStorage.getItem(key)||'');return value??fallback}catch{return fallback}}
    let votes=readJSON(voteKey,{}),used=readJSON(usedKey,[]);
    if(!votes||typeof votes!=='object'||Array.isArray(votes))votes={};
    if(!Array.isArray(used))used=[];
    const count=document.querySelector('#count'),list=document.querySelector('#codes'),toast=document.querySelector('#toast'),report=document.querySelector('#report'),reportSummary=document.querySelector('#report-summary'),reportCopy=document.querySelector('#report-copy');let timer;
    function pop(text){toast.textContent=text;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1700)}
    async function copy(code,success='Copied to clipboard'){try{await navigator.clipboard.writeText(code)}catch{try{const area=document.createElement('textarea');area.value=code;document.body.append(area);area.select();if(!document.execCommand('copy'))throw Error('copy failed');area.remove()}catch{pop('Could not copy');return false}}pop(success);return true}
    function inactiveCodes(){return codes.filter(code=>votes[code]?.m===false)}
    async function copyInactive(){const inactive=inactiveCodes();await copy(`Hi Jeff, these Z Route promo codes appear to be inactive:\n\n${inactive.join('\n')}`,`${inactive.length} inactive code${inactive.length===1?'':'s'} copied`)}
    function markUsed(code){const i=used.indexOf(code);i<0?used.push(code):used.splice(i,1);localStorage.setItem(usedKey,JSON.stringify(used));render()}
    function vote(code,value){const v=votes[code]||{w:0,f:0,m:null};if(v.m===value){v[value?'w':'f']--;v.m=null}else{if(v.m!==null)v[v.m?'w':'f']--;v[value?'w':'f']++;v.m=value}votes[code]=v;localStorage.setItem(voteKey,JSON.stringify(votes));render()}
    function render(){const inactive=inactiveCodes();count.textContent=`${used.filter(code=>codes.includes(code)).length}/${codes.length} used`;report.classList.toggle('show',inactive.length>0);reportSummary.textContent=`${inactive.length} code${inactive.length===1?'':'s'} marked inactive`;list.innerHTML=codes.map(code=>{const v=votes[code]||{w:0,f:0,m:null},isUsed=used.includes(code);return `<article class="card ${isUsed?'is-used':''}"><div><div class="code" id="code-${code}">${code}</div><div class="feedback"><button class="btn ${v.m===true?'selected':''}" onclick="vote('${code}',true)">✓ Worked</button><button class="btn failed ${v.m===false?'selected':''}" onclick="vote('${code}',false)">✕ Didn’t work</button><span class="stats"><span class="worked">${v.w}</span> / <span class="failed">${v.f}</span></span></div></div><div class="actions"><button class="btn ${isUsed?'used':''}" aria-expanded="${!isUsed}" aria-controls="code-${code}" aria-label="${isUsed?'Undo used status for':'Mark as used'} ${code}" onclick="markUsed('${code}')">${isUsed?'Undo used':'Mark used'}</button><button class="btn copy" onclick="copy('${code}')">Copy code</button></div></article>`}).join('')}
    reportCopy.addEventListener('click',copyInactive);
    render();
  </script>
</body>
</html>
