<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>Z Route Promo Codes · JeffxLabs</title>
  <style>
    :root{--bg:#08111f;--panel:#132139;--line:#29415f;--text:#f5f8ff;--muted:#9bb0c9;--cyan:#62e6d2;--bad:#ff8f9a}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 10% 0,#1d3152,transparent 38rem),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:850px;margin:auto;padding:26px 18px 55px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:58px}.brand{color:var(--cyan);font-weight:800;letter-spacing:.1em;font-size:13px}.brand span{color:var(--muted);font-weight:500}.top a{color:var(--muted);text-decoration:none;font-size:13px}.top a:hover{color:var(--text)}.eyebrow{color:var(--cyan);font-size:12px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:clamp(40px,8vw,68px);line-height:1;letter-spacing:-.06em;margin:12px 0 46px}.toolbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.count{color:var(--muted);font-size:13px}.codes{display:grid;gap:12px}.card{background:linear-gradient(145deg,#15243b,#101a2b);border:1px solid var(--line);border-radius:17px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;transition:opacity .18s,border-color .18s}.card.is-used{opacity:.48;background:#0d1727;border-color:#1d3048}.card.is-used:hover{opacity:.72}.code{font:700 22px ui-monospace,monospace;letter-spacing:.035em;overflow-wrap:anywhere}.actions,.feedback{display:flex;gap:7px;align-items:center}.feedback{margin-top:13px}.btn{border:1px solid var(--line);background:#1a2a43;color:var(--text);border-radius:10px;padding:8px 11px;min-height:36px;font:600 12px system-ui;cursor:pointer}.btn:hover,.btn:focus-visible{border-color:var(--cyan);outline:none}.selected,.used{border-color:var(--cyan);color:var(--cyan);background:#17343b}.copy{background:linear-gradient(135deg,var(--cyan),#38b8ba);border:0;color:#07151a;font-size:13px}.stats{color:var(--muted);font-size:12px;margin-left:3px}.worked{color:var(--cyan)}.failed{color:var(--bad)}footer{text-align:center;color:#71819d;font-size:12px;margin-top:40px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#f5f8ff;color:#101827;padding:10px 16px;border-radius:99px;font-weight:700;font-size:13px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:600px){.wrap{padding-top:20px}.top{margin-bottom:44px}.hero h1{margin-bottom:36px}.card{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%}.feedback{flex-wrap:wrap}.count{font-size:12px}}
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="top"><div class="brand">JEFFXLABS <span>/ Z ROUTE</span></div><a href="../">Progression planner ↗</a></nav>
    <section class="hero"><div class="eyebrow">Z Route: Redemption</div><h1>Promo codes,<br>ready to redeem.</h1></section>
    <div class="toolbar"><strong>Current codes</strong><span class="count" id="count"></span></div>
    <section class="codes" id="codes"></section>
    <footer>Built by JeffxLabs</footer>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const codes=['ZRRUSG26','DC50KURM','ZRDAD26','ZRRLW2AC','ZRSURV26','ZRR2NX6Q','ZRR999','ZRRFT9BM','ZRRC7WES','VK90KPJD','ZRYOUTH26','DC45KIGS','DC38KQEU','DC40KHAX','ZRRVJ4YD','DC32KJBV','DC28KRCG','DC30KMWZ','DC35KNZH'];
    const voteKey='zroute-votes',usedKey='zroute-used',votes=JSON.parse(localStorage.getItem(voteKey)||'{}'),used=JSON.parse(localStorage.getItem(usedKey)||'[]');
    const count=document.querySelector('#count'),list=document.querySelector('#codes'),toast=document.querySelector('#toast');let timer;
    function pop(text){toast.textContent=text;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1700)}
    async function copy(code){try{await navigator.clipboard.writeText(code)}catch{const area=document.createElement('textarea');area.value=code;document.body.append(area);area.select();document.execCommand('copy');area.remove()}pop('Copied to clipboard')}
    function markUsed(code){const i=used.indexOf(code);i<0?used.push(code):used.splice(i,1);localStorage.setItem(usedKey,JSON.stringify(used));render()}
    function vote(code,value){const v=votes[code]||{w:0,f:0,m:null};if(v.m===value){v[value?'w':'f']--;v.m=null}else{if(v.m!==null)v[v.m?'w':'f']--;v[value?'w':'f']++;v.m=value}votes[code]=v;localStorage.setItem(voteKey,JSON.stringify(votes));render()}
    function render(){count.textContent=`${used.length}/${codes.length} used`;list.innerHTML=codes.map(code=>{const v=votes[code]||{w:0,f:0,m:null},isUsed=used.includes(code);return `<article class="card ${isUsed?'is-used':''}"><div><div class="code">${code}</div><div class="feedback"><button class="btn ${v.m===true?'selected':''}" onclick="vote('${code}',true)">✓ Worked</button><button class="btn ${v.m===false?'selected':''}" onclick="vote('${code}',false)">✕ Didn’t work</button><span class="stats"><span class="worked">${v.w}</span> / <span class="failed">${v.f}</span></span></div></div><div class="actions"><button class="btn ${isUsed?'used':''}" onclick="markUsed('${code}')">${isUsed?'✓ Used':'Mark used'}</button><button class="btn copy" onclick="copy('${code}')">Copy code</button></div></article>`}).join('')}
    render();
  </script>
</body>
</html>
