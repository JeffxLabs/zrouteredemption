<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>Z Route Promo Codes · JeffxLabs</title>
  <style>
    :root{--bg:#07111f;--panel:#13243b;--line:#294766;--text:#f5f8ff;--muted:#9bb0c9;--cyan:#62e6d2;--bad:#ff8f9a;--shadow:0 18px 50px #02091466}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 12% -8%,#264b70 0,transparent 32rem),radial-gradient(circle at 90% 30%,#143b48 0,transparent 28rem),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 20px 64px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:72px}.brand{color:var(--cyan);font-weight:800;letter-spacing:.1em;font-size:13px}.brand span{color:var(--muted);font-weight:500}.top-right{display:flex;align-items:center;gap:16px}.top a{color:var(--muted);text-decoration:none;font-size:13px}.top a:hover{color:var(--text)}.language{border:1px solid var(--line);background:#102039;color:var(--text);border-radius:9px;padding:7px 9px;font:600 12px system-ui}.eyebrow{color:var(--cyan);font-size:12px;font-weight:750;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:clamp(42px,9vw,76px);line-height:.98;letter-spacing:-.065em;margin:12px 0 52px;max-width:700px}.toolbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.count{color:var(--muted);font-size:13px}.report{display:none;justify-content:space-between;align-items:center;gap:14px;margin:0 0 14px;padding:13px 15px;border:1px solid #6a3c49;border-radius:14px;background:#261b29;color:#ffd8dc;box-shadow:var(--shadow)}.report.show{display:flex}.report-copy{white-space:nowrap;border-color:var(--bad);color:#240b10;background:var(--bad)}.codes{display:grid;gap:12px}.card{background:linear-gradient(145deg,#162940,#101d31);border:1px solid var(--line);border-radius:17px;padding:19px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;box-shadow:0 8px 24px #0209142b;transition:transform .18s,opacity .18s,border-color .18s,padding .18s}.card:hover{transform:translateY(-1px);border-color:#3e6389}.card.is-used{opacity:.45;background:#0b1422;border-color:#1b3048;padding:11px 15px;box-shadow:none}.card.is-used:hover,.card.is-used:focus-within{opacity:.72;transform:none}.card.is-used .feedback,.card.is-used .copy{display:none}.card.is-used .code{font-size:16px;color:#a9b5c5;text-decoration:line-through}.code{font:700 22px ui-monospace,SFMono-Regular,monospace;letter-spacing:.035em;overflow-wrap:anywhere}.actions,.feedback{display:flex;gap:7px;align-items:center}.feedback{margin-top:13px}.btn{border:1px solid var(--line);background:#1a2c47;color:var(--text);border-radius:10px;padding:8px 11px;min-height:38px;font:600 12px system-ui;cursor:pointer;transition:.15s}.btn:hover,.btn:focus-visible{border-color:var(--cyan);outline:2px solid #62e6d288;outline-offset:2px;transform:translateY(-1px)}.selected,.used{border-color:var(--cyan);color:var(--cyan);background:#173b42}.failed.selected{border-color:var(--bad);color:var(--bad);background:#3a2029}.copy{background:linear-gradient(135deg,var(--cyan),#38b8ba);border:0;color:#07151a;font-size:13px}.stats{color:var(--muted);font-size:12px;margin-left:3px}.worked{color:var(--cyan)}.failed{color:var(--bad)}footer{text-align:center;color:#71819d;font-size:12px;margin-top:46px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#f5f8ff;color:#101827;padding:10px 16px;border-radius:99px;font-weight:700;font-size:13px;transition:.2s;pointer-events:none;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:600px){.wrap{padding:18px 14px 48px}.top{margin-bottom:54px;align-items:flex-start}.top-right{gap:8px;flex-direction:column-reverse;align-items:flex-end}.top a{font-size:12px}.hero h1{font-size:clamp(42px,14vw,62px);margin-bottom:38px}.toolbar{margin-bottom:12px}.card{grid-template-columns:1fr;padding:16px;border-radius:15px;gap:13px}.card.is-used{padding:10px 13px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%}.feedback{flex-wrap:wrap;margin-top:11px}.count{font-size:12px}.report{align-items:stretch;flex-direction:column}.report-copy{white-space:normal;width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="top"><div class="brand">JEFFXLABS <span>/ Z ROUTE</span></div><div class="top-right"><a href="../" data-i18n="planner">Progression planner ↗</a><label class="language-label" for="language">Language:</label><select class="language" id="language" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="ru">RU</option><option value="de">DE</option><option value="pl">PL</option><option value="es">ES</option></select></div></nav>
    <section class="hero"><div class="eyebrow">Z Route: Redemption</div><h1 data-i18n="hero">Promo codes,<br>ready to redeem.</h1></section>
    <div class="toolbar"><strong data-i18n="current">Current codes</strong><span class="count" id="count"></span></div>
    <aside class="report" id="report"><span id="report-summary" aria-live="polite"></span><button class="btn report-copy" id="report-copy" type="button" data-i18n="copyReport">Copy inactive report</button></aside>
    <section class="codes" id="codes"></section>
    <footer data-i18n="footer">Built by JeffxLabs</footer>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    // Manage promo codes here: add new values or remove expired ones.
    // Keep newest additions at the top; add dates to the metadata map as codes arrive.
    const entries=[['DC55KQEU','2026-08-23'],['DC50KURM','2026-08-16'],['26CHOCO','2026-07-07'],['ZRRUSG26'],['ZRDAD26'],['ZRRLW2AC'],['ZRSURV26'],['ZRR2NX6Q'],['ZRR999'],['ZRRFT9BM'],['ZRRC7WES'],['ZRYOUTH26'],['DC45KIGS'],['ZRRVJ4YD']];
    const codes=entries.map(([code])=>code),addedDates=Object.fromEntries(entries.filter(([,date])=>date).map(([code,date])=>[code,date]));
    const i18n={en:{planner:'Progression planner ↗',hero:'Promo codes,<br>ready to redeem.',current:'Current codes',copyReport:'Copy inactive report',footer:'Built by JeffxLabs',used:'used',added:'Added',worked:'✓ Worked',failed:'✕ Didn’t work',mark:'Mark used',undo:'Undo used',copy:'Copy code',inactive:'marked inactive',copied:n=>`${n} inactive code${n===1?'':'s'} copied`,copiedCode:'Copied to clipboard',copyFail:'Could not copy',report:'Hi Jeff, these Z Route promo codes appear to be inactive:',message:'Please message Jeff (S117) with this report:'},fr:{planner:'Planificateur de progression ↗',hero:'Codes promo,<br>prêts à être utilisés.',current:'Codes actuels',copyReport:'Copier le rapport des codes inactifs',footer:'Créé par JeffxLabs',used:'utilisés',added:'Ajouté le',worked:'✓ Fonctionne',failed:'✕ Ne fonctionne pas',mark:'Marquer utilisé',undo:'Annuler utilisé',copy:'Copier le code',inactive:'marqués inactifs',copied:n=>`${n} code${n===1?'':'s'} inactif${n===1?'':'s'} copié${n===1?'':'s'}`,copiedCode:'Copié',copyFail:'Impossible de copier',report:'Bonjour Jeff, ces codes promo Z Route semblent inactifs :',message:'Veuillez envoyer ce rapport à Jeff (S117) :'},ru:{planner:'Планировщик прогресса ↗',hero:'Промокоды,<br>готовы к активации.',current:'Актуальные коды',copyReport:'Скопировать отчёт о неактивных',footer:'Создано JeffxLabs',used:'использовано',added:'Добавлен',worked:'✓ Работает',failed:'✕ Не работает',mark:'Отметить использованным',undo:'Отменить отметку',copy:'Копировать код',inactive:'отмечено неактивными',copied:n=>`Скопировано неактивных кодов: ${n}`,copiedCode:'Скопировано',copyFail:'Не удалось скопировать',report:'Привет, Jeff! Эти промокоды Z Route неактивны:',message:'Отправьте этот отчёт Jeff (S117):'},de:{planner:'Fortschrittsplaner ↗',hero:'Promocodes,<br>bereit zum Einlösen.',current:'Aktuelle Codes',copyReport:'Inaktiven Bericht kopieren',footer:'Erstellt von JeffxLabs',used:'verwendet',added:'Hinzugefügt',worked:'✓ Funktioniert',failed:'✕ Funktioniert nicht',mark:'Als verwendet markieren',undo:'Verwendung aufheben',copy:'Code kopieren',inactive:'als inaktiv markiert',copied:n=>`${n} inaktive${n===1?'r Code':' Codes'} kopiert`,copiedCode:'Kopiert',copyFail:'Kopieren nicht möglich',report:'Hallo Jeff, diese Z Route-Promocodes scheinen inaktiv zu sein:',message:'Bitte sende diesen Bericht an Jeff (S117):'},pl:{planner:'Planer postępów ↗',hero:'Kody promocyjne,<br>gotowe do użycia.',current:'Aktualne kody',copyReport:'Kopiuj raport nieaktywnych',footer:'Stworzone przez JeffxLabs',used:'użyte',added:'Dodano',worked:'✓ Działa',failed:'✕ Nie działa',mark:'Oznacz jako użyty',undo:'Cofnij oznaczenie',copy:'Kopiuj kod',inactive:'oznaczonych jako nieaktywne',copied:n=>`Skopiowano nieaktywne kody: ${n}`,copiedCode:'Skopiowano',copyFail:'Nie udało się skopiować',report:'Cześć Jeff, te kody Z Route wydają się nieaktywne:',message:'Wyślij ten raport do Jeffa (S117):'},es:{planner:'Planificador de progreso ↗',hero:'Códigos promocionales,<br>listos para canjear.',current:'Códigos actuales',copyReport:'Copiar informe de inactivos',footer:'Creado por JeffxLabs',used:'usados',added:'Añadido',worked:'✓ Funcionó',failed:'✕ No funcionó',mark:'Marcar usado',undo:'Deshacer usado',copy:'Copiar código',inactive:'marcados inactivos',copied:n=>`${n} código${n===1?'':'s'} inactivo${n===1?'':'s'} copiado${n===1?'':'s'}`,copiedCode:'Copiado',copyFail:'No se pudo copiar',report:'Hola Jeff, estos códigos promocionales de Z Route parecen inactivos:',message:'Envía este informe a Jeff (S117):'}};
    let locale=['en','fr','ru','de','pl','es'].includes(localStorage.getItem('zroute-locale'))?localStorage.getItem('zroute-locale'):'en';
    const t=key=>(i18n[locale]||i18n.en)[key], plural=n=>(i18n[locale]||i18n.en).copied(n);
    const voteKey='zroute-votes',usedKey='zroute-used';
    function readJSON(key,fallback){try{const value=JSON.parse(localStorage.getItem(key)||'');return value??fallback}catch{return fallback}}
    let votes=readJSON(voteKey,{}),used=readJSON(usedKey,[]);
    if(!votes||typeof votes!=='object'||Array.isArray(votes))votes={};
    if(!Array.isArray(used))used=[];
    const count=document.querySelector('#count'),list=document.querySelector('#codes'),toast=document.querySelector('#toast'),report=document.querySelector('#report'),reportSummary=document.querySelector('#report-summary'),reportCopy=document.querySelector('#report-copy');let timer;
    function pop(text){toast.textContent=text;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1700)}
    async function copy(code,success='Copied to clipboard'){try{await navigator.clipboard.writeText(code)}catch{try{const area=document.createElement('textarea');area.value=code;document.body.append(area);area.select();if(!document.execCommand('copy'))throw Error('copy failed');area.remove()}catch{pop('Could not copy');return false}}pop(success);return true}
    function inactiveCodes(){return codes.filter(code=>votes[code]?.m===false)}
    async function copyInactive(){const inactive=inactiveCodes();await copy(`${t('report')}\n\n${t('message')}\n${inactive.join('\n')}`,plural(inactive.length))}
    function markUsed(code){const i=used.indexOf(code);i<0?used.push(code):used.splice(i,1);localStorage.setItem(usedKey,JSON.stringify(used));render()}
    function vote(code,value){const v=votes[code]||{w:0,f:0,m:null};if(v.m===value){v[value?'w':'f']--;v.m=null}else{if(v.m!==null)v[v.m?'w':'f']--;v[value?'w':'f']++;v.m=value}votes[code]=v;localStorage.setItem(voteKey,JSON.stringify(votes));render()}
    function render(){const inactive=inactiveCodes();document.documentElement.lang=locale;document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=t(el.dataset.i18n));count.textContent=`${used.filter(code=>codes.includes(code)).length}/${codes.length} ${t('used')}`;report.classList.toggle('show',inactive.length>0);reportSummary.textContent=`${inactive.length} ${t('inactive')}`;list.innerHTML=codes.map(code=>{const v=votes[code]||{w:0,f:0,m:null},isUsed=used.includes(code),date=addedDates[code];return `<article class="card ${isUsed?'is-used':''}"><div><div class="code" id="code-${code}">${code}</div>${date?`<div class="stats">${t('added')} ${date}</div>`:''}<div class="feedback"><button class="btn ${v.m===true?'selected':''}" onclick="vote('${code}',true)">${t('worked')}</button><button class="btn failed ${v.m===false?'selected':''}" onclick="vote('${code}',false)">${t('failed')}</button><span class="stats"><span class="worked">${v.w}</span> / <span class="failed">${v.f}</span></span></div></div><div class="actions"><button class="btn ${isUsed?'used':''}" aria-expanded="${!isUsed}" aria-controls="code-${code}" aria-label="${isUsed?t('undo'):t('mark')} ${code}" onclick="markUsed('${code}')">${isUsed?t('undo'):t('mark')}</button><button class="btn copy" onclick="copy('${code}',t('copiedCode'))">${t('copy')}</button></div></article>`}).join('')}
    document.querySelector('#language').value=locale;document.querySelector('#language').addEventListener('change',e=>{locale=e.target.value;localStorage.setItem('zroute-locale',locale);render()});
    reportCopy.addEventListener('click',copyInactive);
    render();
  </script>
</body>
</html>
